<section class="barra">
  <app-stepper [passos]="passos"></app-stepper>
  <!-- <app-progress-bar [progresso]="progresso"></app-progress-bar> -->
</section>

<main>

  <article class="resumo">
    <ul class="cards">
      @if (resultado !== '') {
      <li class="cards_item">
          <div class="card">
            <div class="card_content">
                <img class="copy" src="copy-clipboard.svg" alt="ícone copiar para área de transferência" (click)="copiarTexto(resultado)" />
              <h2 class="card_title">Resumo do seu perfil</h2>
              <div class="card_text">
                <p [innerHTML]="resultado">{{resultado}}</p>
              </div> 
            </div>
          </div>
        </li>
      }

      @if(infos.length > 0){
        <li class="cards_item">
          <div class="card">
            <div class="card_content">
                @for(info of infos; track info) {
                <h2 class="card_title">{{info.titulo}}</h2>
                <div class="card_text">
                  <p>{{info.texto}}
                  </p>
                </div>
              }
              </div>
            </div>
          </li>
      }
    </ul>
  </article>

  @if (carregando) {
    <div class="spinner">
      <mat-spinner></mat-spinner>
    </div>
  }

  <div class="chat">
    <div class="chat-header">
      <br />
      <span class="chat-header-title">Ajudante</span>
    </div>
    <div class="chat-box" #chatBox>
      @for (msg of msg; track msg) {
      <div [ngClass]="msg.usuario === 'usuario' ? 'chat-usuario' : 'chat-bot'">
        <p>
          {{ msg.texto }}
        </p>
      </div>
      }
    </div>
    <div class="chat-input">
      <input [(ngModel)]="digitarMensagem" type="text" placeholder="Digite seus dados"
        (keydown.enter)="enviarInfos()" />
      <button class="btn-enviar" (click)="enviarInfos()">Enviar</button>
    </div>
    <div class="botoes">
      <button (click)="valorInvestir()">Quanto posso investir?</button>
      <button (click)="divisaoValores()">Dividir 70/20/10</button>
      <button (click)="gastosFixos()">Meus gastos fixos</button>
    </div>
  </div>

</main>
