<main>
  
  <section class="barra">
    <app-stepper [passos]="passos"></app-stepper>
    <app-progress-bar [progresso]="progresso"></app-progress-bar>
  </section>

  <div class="chat">
    <div class="chat-box" #chatBox>
      <div class="chat-header">
        <br />
        <span>Ajudante</span>
      </div>
      @for (msg of msg; track msg) {
      <div [ngClass]="msg.usuario === 'usuario' ? 'chat-usuario' : 'chat-bot'">
        <p>
          {{ msg.texto }}
        </p>
      </div>
      }
    </div>
    <div class="chat-input">
      <input [(ngModel)]="digitarMensagem" type="text" placeholder="Digite seus dados"  (keydown.enter)="enviarInfos()"/>
      <button (click)="enviarInfos()">
        Enviar
      </button>
    </div>
  </div>
</main>
